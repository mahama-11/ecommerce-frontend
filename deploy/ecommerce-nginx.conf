server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Runtime-injected env config should never be cached aggressively.
  location = /env-config.js {
    add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate";
    expires -1;
    try_files $uri =404;
  }

  # Static assets: long cache for hits, graceful fallback for stale chunks.
  # When a user's browser requests an old chunk (e.g. after a new deploy),
  # serve index.html instead so the SPA bootstraps with the latest version.
  location /assets/ {
    expires 7d;
    add_header Cache-Control "public, max-age=604800, immutable";
    try_files $uri /index.html;
  }

  # SPA history fallback: serve index.html for app routes such as /draw/changing-mannequin.
  # Also ensure index.html itself is never cached so users always get the latest entry point.
  location / {
    add_header Cache-Control "no-cache, no-store, must-revalidate, proxy-revalidate";
    add_header Pragma "no-cache";
    add_header Expires "0";
    try_files $uri $uri/ /index.html;
  }
}
